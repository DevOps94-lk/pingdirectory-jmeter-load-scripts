# =====================================================================
#  EDIT THE 4 REPLACE_ME VALUES BELOW (replace REPLACE_ME), SAVE, DONE.
#  Keep the format "key = value" with nothing after the value.
# =====================================================================

# PingDirectory load balancer IP or hostname:
pd.hostWrite = REPLACE_ME

# Bind DN (e.g. cn=directory manager):
pd.bindDN = REPLACE_ME

# Bind password (if it contains a backslash \, write it as \\):
pd.bindPw = REPLACE_ME

# =====================================================================
#  HOW MUCH LOAD  --  operations per second (the STARTING point).
#  Test 1 holds these steady. Test 2 scales ALL of them up together.
#  Set any of them to 0 to turn that operation off.
#  RULE: keep deletes <= adds (deletes remove what adds create).
# =====================================================================
pd.searchPerSec = 25
pd.addPerSec    = 1
pd.deletePerSec = 0
pd.modifyPerSec = 0

# =====================================================================
#  Everything below has good defaults. Leave it unless told otherwise.
# =====================================================================

# Port (1636 is the secure LDAPS port). LDAPS is on by default.
pd.port = 1636

# Where the test runs. All test records are created directly under this DN,
# and the search / modify entry below must live under it too.
pd.baseDN = REPLACE_ME

# What each search looks for - must match a real entry so it hits the index:
pd.searchFilter = (uid=tommytester)

# Which existing entry the Modify load updates (relative to the base DN above):
pd.modifyTargetDN = uid=tommytester

# Test 2 ramp: increase all rates by this % every this many seconds.
pd.rampStepPercent = 30
pd.rampStepSeconds = 120

# A request with no reply after this many ms is recorded as a failure
# (otherwise a hung PingDirectory would never show up as an error):
pd.readTimeoutMs = 30000

# Give adds a head start before deletes begin (seconds):
pd.deleteStartDelaySec = 10

# =====================================================================
#  DISTRIBUTED MODE (optional)  --  controller + remote engines.
#  Leave BLANK to run everything on THIS one machine (the default).
#
#  To spread the load across remote JMeter engines, list their
#  addresses here, comma-separated (host or host:port; the default
#  engine port is 1099). The machine you run the script on becomes the
#  controller; it collects results and builds the report but does NOT
#  generate load itself.
#
#  One-time setup on each engine is required first -- see
#  "Running across multiple machines" in the README.
#
#  IMPORTANT: the per-second rates and thread counts above apply PER
#  ENGINE. Total load = (the rate above) x (number of engines). With
#  3 engines, pd.searchPerSec = 25 pushes ~75/s in total. Divide your
#  target by the engine count, or just read the aggregate in the report.
#
#  Example:  pd.remoteEngines = 10.0.0.11,10.0.0.12,10.0.0.13
# =====================================================================
pd.remoteEngines =
