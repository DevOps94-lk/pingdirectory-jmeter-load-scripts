# =====================================================================
#  EDIT THE 3 VALUES BELOW (replace REPLACE_ME), SAVE, DONE.
#  Keep the format "key = value" with nothing after the value.
# =====================================================================

# PingDirectory load balancer IP or hostname:
pd.hostWrite = EXAMPLE_HOSTNAME

# Bind DN (e.g. cn=directory manager):
pd.bindDN = EXAMPLE_BIND_DN

# Bind password:
pd.bindPw = EXAMPLE_BIND_PASSWORD

# =====================================================================
#  HOW MUCH LOAD  --  operations per second (the STARTING point).
#  Test 1 holds these steady. Test 2 scales ALL of them up together.
#  Set any of them to 0 to turn that operation off.
#  RULE: keep deletes <= adds (deletes remove what adds create).
# =====================================================================
pd.searchPerSec = SEARCHES_PER_SECOND
pd.addPerSec    = ADDS_PER_SECOND
pd.deletePerSec = DELETES_PER_SECOND
pd.modifyPerSec = MODIFIES_PER_SECOND

# =====================================================================
#  Everything below has good defaults. Leave it unless told otherwise.
# =====================================================================

# Port (1636 is the secure LDAPS port). LDAPS is on by default.
pd.port = 1636

# Where the test runs (from the DIT). Test records go under ou=loadgen beneath this.
pd.baseDN = TEST_BASE_DN

# What each search looks for - must match a real entry so it hits the index:
pd.searchFilter = (SEARCH_FILTER. Example: (objectClass=person) or (uid=loadgen*))

# Which existing entry the Modify load updates (relative to the base DN above):
pd.modifyTargetDN = MODIFY_TARGET_DN

# Test 2 ramp: increase all rates by this % every this many seconds.
pd.rampStepPercent = 5
pd.rampStepSeconds = 30

# Give adds a head start before deletes begin (seconds):
pd.deleteStartDelaySec = 10
