# =====================================================================
#  PingDirectory flow load test - settings
#  Fill in every REPLACE_ME, save, and run (see README.md).
#  Rules: "key = value", NO spaces after the value, no quotes.
#         A backslash in a value must be doubled (\\) - e.g. in a DN: ou=test\\,o=X
#  A preflight step on every engine binds as the admin and checks the
#  test OU exists; the run stops straight away if that fails.
# =====================================================================

# ---------- 1. Where to connect (LDAPS - the certificate is trusted automatically) ----------
# PingDirectory load balancer IP or hostname:
pd.hostWrite = REPLACE_ME
pd.port = 1636

# The loadtester admin account (needs access to the whole test OU):
pd.bindDN = REPLACE_ME
pd.bindPw = REPLACE_ME

# DN of the TEST OU. Every entry the test creates, reads, changes and deletes lives under it:
pd.testOuDN = REPLACE_ME

# ---------- 2. The test users ----------
# ONE password given to every test user. It must satisfy PingDirectory's password policy:
pd.userPassword = REPLACE_ME

# Marker stored in each test user's description. Also what you search for to clean up leftovers:
pd.description = PD-LOADTEST

# Test users get mail = <uid>@<this domain>:
pd.mailDomain = loadtest.example

# Name templates, written "First Last". Each loop takes the next one and builds a unique uid like
# james.smith-<runstamp>-<engine>-<number>. Add or remove lines freely: number them 1, 2, 3...
# with NO gaps, and set pd.nameCount to how many there are. (If the count is too high the extra
# slots just reuse "James Smith"; the uid is still unique, so nothing breaks.)
pd.nameCount = 10
pd.name.1 = James Smith
pd.name.2 = Mary Johnson
pd.name.3 = John Williams
pd.name.4 = Patricia Brown
pd.name.5 = Robert Jones
pd.name.6 = Jennifer Miller
pd.name.7 = Michael Davis
pd.name.8 = Linda Wilson
pd.name.9 = William Moore
pd.name.10 = Elizabeth Taylor

# Step 6 changes cn and sn: new cn = old cn + cnSuffix, new sn = old sn + snSuffix.
# Step 7 checks the entry shows exactly these. The two suffixes MUST differ. No leading spaces.
pd.modify.cnSuffix = -cn-upd
pd.modify.snSuffix = -sn-upd

# ---------- 3. How much load ----------
# Target FULL FLOWS (all steps) per second, TOTAL across all engines:
pd.flowsPerSec = 5

# How many remote engines are running. The plan divides the target above by this so each
# engine does its share. (Use 1 if you run on a single machine.)
pd.engineCount = 1

# Worker threads PER ENGINE. Rule of thumb: threads >= (flowsPerSec / engineCount) x (seconds one
# flow takes) x 1.5. If the achieved rate in the report stays below the target while errors are
# ~0, raise this.
pd.threads = 50

# Seconds to start all threads over (avoids a connection burst at the start):
pd.threadRampSec = 30

# ---- Ramp plan only (pingdir-flow-ramp.jmx): every rampStepSeconds, add rampStepPercent of the
# starting rate (smoothly). Ignored by the steady plan.
pd.rampStepPercent = 30
pd.rampStepSeconds = 120

# =====================================================================
#  Advanced - the defaults are fine. Leave unless told otherwise.
# =====================================================================

# Step 1 generic search (under the test OU): filter, scope (0 base, 1 one-level, 2 subtree), and
# size limit (0 = none). NOTE: if a size limit is reached the search is recorded as a failure.
pd.step1Filter = (objectClass=*)
pd.step1Scope = 1
pd.step1SizeLimit = 0

# How long (ms) a flow waits for its partner thread to finish the user steps (04, 05, 05.1)
# before recording a failed "TIMEOUT" row and carrying on:
pd.userStepTimeoutMs = 60000

# Connect timeout (ms). (The request read timeout is a one-time Java setting - see README section 0.)
pd.connectTimeoutMs = 5000


# =====================================================================
#  Reporting (HTML report) - the defaults are fine
#  These are read by JMeter when it builds the HTML report (the -e -o
#  option, or Tools > Generate HTML report). They only change how the
#  report looks; they never affect the test. If the report ignores them,
#  copy these lines into JMETER_HOME\bin\user.properties on the machine
#  that builds the report (the controller).
# =====================================================================

# Leave the preflight ("PRE ...") and cleanup-sweep ("TD ...") rows out of the report tables and charts:
jmeter.reportgenerator.sample_filter = ^(?!(PRE|TD) ).*

# Chart resolution in milliseconds. 10000 suits runs of 10+ minutes.
# For a short smoke test use 1000.
jmeter.reportgenerator.overall_granularity = 10000

# Apdex ("how many requests felt fast"), in milliseconds. A bind opens a new TLS
# connection so it is slower than other steps; these defaults rate a step
# "satisfied" up to 2 s and "tolerating" up to 4 s. Tune to your SLA.
jmeter.reportgenerator.apdex_satisfied_threshold = 2000
jmeter.reportgenerator.apdex_tolerated_threshold = 4000
