# Settings for ldap-simple-flow.jmx   (format: key = value, no trailing spaces, no quotes)

# --- where to connect (LDAPS) ---
ldap.host = REPLACE_ME
ldap.port = 1636
ldap.bindDN = REPLACE_ME
ldap.bindPw = REPLACE_ME

# DN of the test OU. Everything the test creates lives directly under it.
ldap.testOuDN = REPLACE_ME

# One password for every test user (must satisfy the password policy)
ldap.userPassword = REPLACE_ME

# Marker stored in each test user's description (use it to find leftovers)
ldap.description = LDAP-LOADTEST
ldap.mailDomain = loadtest.example

ldap.connectTimeoutMs = 5000

# --- how much load ---
# Parallel threads. Each thread runs the whole sequence on its own.
ldap.threads = 1
# Seconds to start all threads over
ldap.rampSec = 1
# Times each thread repeats the WHOLE sequence (admin bind ... admin unbind). -1 = until stopped
ldap.passes = 1
# Create/modify/delete cycles inside one pass, each on a brand-new account
ldap.cycles = 3
