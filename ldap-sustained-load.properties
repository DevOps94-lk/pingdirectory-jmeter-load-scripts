# Settings for ldap-sustained-load.jmx   (format: key = value, no trailing spaces, no quotes)

# --- where to connect (LDAPS) ---
ldap.host = REPLACE_ME
ldap.port = 1636
ldap.bindDN = REPLACE_ME
ldap.bindPw = REPLACE_ME

# DN of the test OU. Everything the test creates lives directly under it.
ldap.testOuDN = REPLACE_ME

# One password for every test user (must satisfy the password policy)
ldap.userPassword = REPLACE_ME

# Marker stored in each test user's description. The cleanup after the test deletes
# every user under the test OU that has this marker and a uid starting with "lt-".
ldap.description = LDAP-LOADTEST
ldap.mailDomain = loadtest.example

ldap.connectTimeoutMs = 5000

# --- the load shape: 5 waves of threads (a staircase), then a plateau ---
# Wave 1 starts at 0 s, wave 2 at stepEverySec, wave 3 at 2 x stepEverySec, ... wave 5 at 4 x stepEverySec.
# Every wave runs until totalSec, so after the last wave starts the load holds at 5 x stepThreads.

# Threads added by each wave (full load = 5 x this)
ldap.stepThreads = 10
# Seconds between waves
ldap.stepEverySec = 300
# Seconds the first wave takes to start its threads (later waves start all their threads at once)
ldap.rampSec = 30
# Seconds from test start until every thread stops. MUST be greater than 4 x stepEverySec;
# the time above that is the sustained plateau at full load (default: 1500 - 1200 = 300 s).
ldap.totalSec = 1500

# Create/modify/delete cycles inside one pass of the flow
ldap.cycles = 5
